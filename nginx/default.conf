server {
  listen 80 default_server;
  listen [::]:80 default_server;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Redirects stay relative so the TLS proxy in front keeps the scheme.
  absolute_redirect off;

  gzip on;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/xml;
  gzip_min_length 1024;
  gzip_vary on;

  include /etc/nginx/snippets/security-headers.conf;

  # Astro emits /route/index.html and a top-level 404.html.
  error_page 404 /404.html;

  # Pages. Serve /about and /about/ straight from about/index.html (no redirect hop),
  # and revalidate HTML so deploys show up immediately.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri $uri/index.html $uri.html =404;
  }

  # Hashed filenames (JS, CSS, fonts, optimized images) are safe to cache forever.
  # ^~ stops the image regex below from overriding this for hashed images.
  location ^~ /_astro/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Unhashed files in public/ (favicons).
  location ~* \.(ico|svg|png|jpg|jpeg|webp|avif)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=604800";
  }
}
